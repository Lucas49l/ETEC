
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title></title>
        <style>
            body{
                opacity: 0;
            }
        </style>

    </head>
    <body>

        <h1>Bateria Online</h1>

        <section class="teclado">
            <button class="tecla tecla_pom keyq numpad7"><span>Q</span> Pom</button>
            <button class="tecla tecla_clap keyw numpad8"><span>W</span> Clap</button>
            <button class="tecla tecla_tim keye numpad9"><span>E</span> Tim</button>

            <button class="tecla tecla_puff keya numpad4"><span>A</span> Puff</button>
            <button class="tecla tecla_splash keys numpad5"><span>S</span> Splash</button>
            <button class="tecla tecla_toim keyd numpad6"><span>D</span> Toim</button>

            <button class="tecla tecla_psh keyz numpad1"><span>Z</span> Psh</button>
            <button class="tecla tecla_tic keyx numpad2"><span>X</span> Tic</button>
            <button class="tecla tecla_tom keyc numpad3"><span>C</span> Tom</button>
        </section>

        <div class="composer">
            <input type="text" id="input" placeholder="Faça uma composição..."/>
            <button id="botao">Tocar</button>
        </div>

        <audio src="#" class="s_keyq s_numpad7" id="som_tecla_pom"></audio>
        <audio src="#" class="s_keyw s_numpad8" id="som_tecla_clap"></audio>
        <audio src="#" class="s_keye s_numpad9" id="som_tecla_tim"></audio>
        <audio src="#" class="s_keya s_numpad4" id="som_tecla_puff"></audio>
        <audio src="#" class="s_keys s_numpad5" id="som_tecla_splash"></audio>
        <audio src="#" class="s_keyd s_numpad6" id="som_tecla_toim"></audio>
        <audio src="#" class="s_keyz s_numpad1" id="som_tecla_psh"></audio>
        <audio src="#" class="s_keyx s_numpad2" id="som_tecla_tic"></audio>
        <audio src="#" class="s_keyc s_numpad3" id="som_tecla_tom"></audio>

        <script src="main.js"></script>
    </body>
</html>
